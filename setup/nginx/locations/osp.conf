# Serve Flask static assets directly from disk — bypasses Gunicorn entirely.
# Flask appends ?v=<hash> to all static URLs for cache-busting, so these
# are safe to cache for 1 year as immutable resources.
location /static/ {
    alias /opt/osp/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    log_not_found off;
}

location / {
    proxy_pass http://socket_nodes;
    proxy_redirect     off;

    proxy_set_header   Host                 $host:$server_port;
    proxy_set_header   X-Real-IP            $remote_addr;
    proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto    $scheme;
}
