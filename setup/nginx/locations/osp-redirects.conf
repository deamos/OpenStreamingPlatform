location /ospAuth {
    internal;

    # Fix #10: Channel ID is now resolved via the $ospChannelID map in nginx.conf
    # (replaces the previous chain of if blocks — map is evaluated once, not repeatedly).
    proxy_pass              http://socket_nodes/auth;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Original-URI $request_uri;
    proxy_set_header        X-Channel-ID $ospChannelID;
    proxy_cache             auth_cache;
    proxy_cache_key         "$cookie_ospSession$http_x_auth_token$ospChannelID";
    proxy_cache_valid       200 10m;
    proxy_ignore_headers    Set-Cookie;

    # Fix #11: Skip the cache entirely when channel ID could not be determined.
    # Prevents all anonymous requests to unrecognised URLs sharing one cache entry.
    proxy_cache_bypass      $bypass_auth_cache;
    proxy_no_cache          $bypass_auth_cache;

}

location /videos {
        auth_request /ospAuth;
        alias /var/www/videos;
        # Fix #6: VOD content is immutable once recorded.
        # ETag (nginx default for static files) enables 304 Not Modified on revalidation.
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
}

location /videos/temp {
        # Fix #1: Temp uploads must not be publicly accessible without authentication.
        auth_request /ospAuth;
        alias /var/www/videos/temp;
}

location /stream-thumb {
        auth_request /ospAuth;
        alias /var/www/stream-thumb;
        # Fix #8: Thumbnails refresh every few seconds during a live stream.
        # 10s max-age cuts repeated requests while still staying near-real-time.
        expires 10s;
        add_header Cache-Control "public, must-revalidate";
}

location /live-adapt {
#        auth_request /ospAuth;
        alias /var/www/live-adapt;
}

location /live {
#        auth_request /ospAuth;
        alias /var/www/live;
}

location /keys {
        auth_request /ospAuth;
        alias /var/www/keys;
        expires 30s;
        add_header Cache-Control "private";
}

location /keys-adapt {
        auth_request /ospAuth;
        alias /var/www/keys-adapt;
        expires 30s;
        add_header Cache-Control "private";
}

location  /static {
        alias /opt/osp/static;
}

# Fix #7: Changed from regex location (~ /images(.*)) to faster prefix location (/images).
# Replaced no-cache with 5-minute max-age + ETag: browsers can use 304 Not Modified
# instead of re-downloading the body on every request (profile pics, thumbnails, etc.).
# Removed stray HLS types{} block (m3u8/ts MIME types have no effect here).
location /images {
        root /var/www;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        etag on;

        # CORS setup
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length';

        # allow CORS preflight requests
        if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
        }
}

location /edge {
 #   auth_request /ospAuth;
    rewrite ^/edge/(.*)$ $scheme://$ospedge_node/edge/$1 redirect;
}

location /edge-adapt {
#    auth_request /ospAuth;
    rewrite ^/edge-adapt/(.*)$ $scheme://$ospedge_node/edge-adapt/$1 redirect;
}
