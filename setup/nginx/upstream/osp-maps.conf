# OSP nginx map directives — included at http{} level via upstream/*.conf glob.
#
# These maps are consumed by /ospAuth in osp-redirects.conf:
#   - $ospChannelID  : channel location extracted from the request URI
#   - $bypass_auth_cache : set to 1 when no channel ID could be determined,
#                          preventing a shared degenerate cache entry for
#                          all anonymous requests to unrecognised URLs.
#
# IMPORTANT: This file must be included at the http{} level, not inside a
# server{} or location{} block.  The upstream/*.conf include in nginx.conf
# satisfies this requirement.

# Extract the channel location ID from the request URI.
# First matching rule wins.  All active resource types are covered; the
# commented rules below mirror the commented-out auth_request blocks in
# osp-redirects.conf and can be enabled together if needed.
map $request_uri $ospChannelID {
    ~^/videos/([^/]+)/          $1;   # recorded videos and clips (chanLoc is always segment 1)
    ~^/stream-thumb/([^.]+)\.   $1;   # live stream thumbnails
    ~^/keys/([^/]+)/            $1;   # HLS encryption keys
    ~^/keys-adapt/([^_]+)_      $1;   # adaptive HLS encryption keys
#   ~^/live/([^/]+)/            $1;   # live HLS (enable with auth_request in osp-redirects.conf)
#   ~^/live-adapt/([^.]+)\.     $1;   # adaptive live HLS (same)
#   ~^/edge/([^/]+)/            $1;   # edge HLS
#   ~^/edge-adapt/([^.]+)\.     $1;   # adaptive edge HLS
    default                     "";
}

# Produce a non-zero bypass signal when the channel ID cannot be determined.
# proxy_cache_bypass and proxy_no_cache in /ospAuth use this variable to skip
# the cache rather than creating a shared entry keyed to the empty string.
map $ospChannelID $bypass_auth_cache {
    ""      1;
    default 0;
}
