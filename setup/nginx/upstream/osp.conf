# Load Balancing for OSP Core
# max_fails=3        : stop sending to a worker after 3 consecutive failures
# fail_timeout=30s   : retry the worker after 30s of exclusion
upstream socket_nodes {
    sticky cookie route expires=8h path=/;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5003 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5004 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5005 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5006 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5007 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5008 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5009 max_fails=3 fail_timeout=30s;
}
